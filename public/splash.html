<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavithLabs · Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Silkscreen:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; font-family: Outfit, "Segoe UI", sans-serif; background: transparent; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .splash { position: relative; width: 400px; height: 500px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f6f6fb; background: radial-gradient(ellipse at 50% 44%, rgba(79,75,156,.28), transparent 50%), linear-gradient(145deg,#0d1021,#090b18 72%); border: 1px solid rgba(192,199,229,.18); isolation: isolate; }
    .splash::before { position: absolute; z-index: -2; inset: 0; content: ""; opacity: .18; background-image: linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px); background-size: 34px 34px; mask-image: radial-gradient(ellipse,black,transparent 78%); }
    .splash::after { position: absolute; z-index: -1; top: -40%; left: -65%; width: 62%; height: 180%; content: ""; transform: rotate(24deg); background: linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent); animation: sweep 2.1s ease-in-out infinite; }
    .splash-frame { position: absolute; inset: 12px; pointer-events: none; border: 1px solid rgba(199,206,239,.1); }
    .splash-frame::before,.splash-frame::after { position: absolute; width: 17px; height: 17px; content:""; border-color:#ff4059; border-style:solid; }
    .splash-frame::before { top:-1px;left:-1px;border-width:1px 0 0 1px; }
    .splash-frame::after { right:-1px;bottom:-1px;border-width:0 1px 1px 0; }
    .splash-topline { position: absolute; top: 26px; left: 29px; right: 29px; display: flex; align-items: center; justify-content: space-between; color: #7f869f; font: 7px Silkscreen, monospace; }
    .splash-topline span:last-child { color: #ff6d80; }
    .logo-stage { position: relative; width: 328px; margin-top: 4px; filter: drop-shadow(0 12px 28px rgba(255,64,89,.13)); }
    .logo-stage svg { display: block; width: 100%; overflow: visible; }
    .wordmark { opacity: 0; animation: text-render .75s .42s cubic-bezier(.16,1,.3,1) forwards; }
    .brackets { fill: none; stroke: #f6f6fb; stroke-width: 8; stroke-linecap: square; stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw-mark .75s .08s cubic-bezier(.6,0,.35,1) forwards; }
    .wand { fill: none; stroke: url(#wand); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw-mark .46s .56s ease-out forwards; }
    .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: spark-in .36s .86s cubic-bezier(.16,1,.3,1) forwards; }
    .render-line { position: absolute; top: 0; left: -5%; width: 3px; height: 100%; opacity: 0; background: #ff8491; box-shadow: 0 0 10px 3px rgba(255,64,89,.45),0 0 50px 11px rgba(255,64,89,.2); animation: scan 1.1s .44s ease-in-out both; }
    .splash-caption { margin-top: 34px; color: #e5e6ef; font: 8px Silkscreen, monospace; letter-spacing: .06em; }
    .splash-subtitle { margin-top: 9px; color: #888fa8; font: 11px Outfit, sans-serif; letter-spacing: .08em; }
    .splash-loader { position: absolute; bottom: 56px; width: 244px; }
    .loader-label { display: flex; justify-content: space-between; color: #8188a0; font: 6px Silkscreen,monospace; }
    .loader-track { height: 2px; margin-top: 10px; overflow: hidden; background: rgba(255,255,255,.1); }
    .loader-track i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg,transparent,#e92c49,#ff8390); box-shadow: 0 0 14px rgba(255,64,89,.55); animation: loading 1.1s ease-in-out infinite; }
    .splash-footer { position: absolute; right: 28px; bottom: 23px; left: 28px; display: flex; justify-content: space-between; color: #5c637d; font: 6px Silkscreen,monospace; }
    @keyframes draw-mark { to { stroke-dashoffset: 0; } }
    @keyframes text-render { 0% { opacity:0; filter:blur(8px); letter-spacing:9px; } 100% { opacity:1; filter:blur(0); letter-spacing:0; } }
    @keyframes spark-in { 0% { opacity:0; transform:scale(.15) rotate(-28deg); } 75% { opacity:1; transform:scale(1.16) rotate(7deg); } 100% { opacity:1; transform:scale(1) rotate(0); } }
    @keyframes scan { 0% { left:-5%;opacity:0; } 16% { opacity:.85; } 85% { opacity:.55; } 100% { left:105%;opacity:0; } }
    @keyframes loading { 0% { transform:translateX(-110%); } 100% { transform:translateX(360%); } }
    @keyframes sweep { 0% { transform:translateX(0) rotate(24deg); } 100% { transform:translateX(850px) rotate(24deg); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms!important;animation-iteration-count:1!important; } .wordmark,.spark { opacity:1; } .brackets,.wand { stroke-dashoffset:0; } }
  </style>
</head>
<body>
  <main class="splash">
    <div class="splash-frame"></div>
    <div class="splash-topline"><span>NAVITH.LABS / GAME CLIENT</span><span>BUILD 0.1</span></div>
    <div class="logo-stage" aria-label="navith.labs">
      <svg viewBox="0 0 640 140" role="img" aria-hidden="true">
        <defs><linearGradient id="wand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff4059"/><stop offset="1" stop-color="#ff8794"/></linearGradient></defs>
        <g class="wordmark">
          <text x="4" y="101" fill="#f7f7fb" font-family="Outfit,Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-5">navith</text>
          <circle cx="247" cy="91" r="5.5" fill="#ff3e57" />
          <text x="263" y="101" fill="#9297ad" font-family="Outfit,Arial,sans-serif" font-size="82" font-weight="300" letter-spacing="-5">labs</text>
        </g>
        <path class="brackets" d="M496 29h-18v78h18M606 29h18v78h-18" />
        <path class="wand" d="m527 91 43-47" />
        <g class="spark"><path d="m571 27 4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10Z" fill="#f5f6fb"/><path d="m543 35 2.4 6.1 6.1 2.4-6.1 2.4-2.4 6.1-2.4-6.1-6.1-2.4 6.1-2.4 2.4-6.1Z" fill="#ff3e57"/><circle cx="582" cy="67" r="3" fill="#f5f6fb"/></g>
      </svg>
      <div class="render-line"></div>
    </div>
    <div class="splash-caption">UN NUEVO LUGAR PARA JUGAR</div>
    <div class="splash-subtitle">Preparando tu espacio de juego</div>
    <div class="splash-loader"><div class="loader-label"><span>RENDER DEL SISTEMA</span><span>...</span></div><div class="loader-track"><i></i></div></div>
    <div class="splash-footer"><span>MINECRAFT JAVA</span><span>DESIGNED BY NAVITH.LABS</span></div>
  </main>
</body>
</html>
