[package]
name = "navithlabs-launcher"
version = "0.1.0"
description = "NavithLabs Launcher para Minecraft"
authors = ["NavithLabs"]
edition = "2021"

[lib]
name = "navithlabs_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
tokio = { version = "1", features = ["full"] }
zip = "0.6"
tauri-plugin-dialog = "2.7.0"
sysinfo = "0.38.4"
md5 = "0.8.0"
uuid = { version = "1.23.1", features = ["v4"] }
tauri-plugin-oauth = "2.0.0"
base64 = "0.22"
discord-rich-presence = "0.2.4"
sha2 = "0.10"
sha1 = "0.10"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
regex = "1.10"
unrar = "0.5.8"
rayon = "1.8"
lazy_static = "1.4"
futures = "0.3"
flate2 = "1.0"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

